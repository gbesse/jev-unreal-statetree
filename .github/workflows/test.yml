# Purpose: Run portable validation while recording that licensed Unreal compilation remains a host-specific check.
name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - run: npm test
      - run: npm run demo:check
